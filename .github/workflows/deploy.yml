name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image refs (GHCR requires lowercase)
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/$owner/artlog-app" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/$owner/artlog-ai" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push app (Spring)
        uses: docker/build-push-action@v6
        with:
          context: ./back
          target: prod
          push: true
          tags: |
            ${{ steps.img.outputs.app }}:latest
            ${{ steps.img.outputs.app }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build & push ai (FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          target: prod
          push: true
          tags: |
            ${{ steps.img.outputs.ai }}:latest
            ${{ steps.img.outputs.ai }}:${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Deploy on VPS (pull & up, no build)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER,APP_IMAGE,AI_IMAGE
          script: |
            cd /opt/artlog
            # 최신 deploy.sh/compose 를 먼저 받아온 뒤 그 버전으로 실행한다.
            # (이렇게 안 하면 첫 전환 시 서버의 옛 deploy.sh 가 그대로 돌아버린다)
            git fetch --prune origin
            git reset --hard origin/main
            bash deploy/deploy.sh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_IMAGE: ${{ steps.img.outputs.app }}:${{ github.sha }}
          AI_IMAGE: ${{ steps.img.outputs.ai }}:${{ github.sha }}
